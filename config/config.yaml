project:
  seed: 42
  locale: en_US
  snapshot_date: "2026-06-01"
  home_country: US

paths:
  reference: data/landing/reference
  transactions: data/landing/transactions
  ground_truth: data/_ground_truth

customers:
  n_customers: 3000
  segment_weights:
    RETAIL: 0.75
    PREMIUM: 0.18
    SMALL_BUSINESS: 0.07
  income_bands:
    RETAIL: ["<30k", "30k-50k", "50k-80k"]
    PREMIUM: ["80k-150k", "150k-300k", ">300k"]
    SMALL_BUSINESS: ["50k-80k", "80k-150k", "150k-300k"]
  kyc_weights:
    LOW: 0.80
    MEDIUM: 0.17
    HIGH: 0.03
  channel_weights:
    MOBILE: 0.65
    WEB: 0.25
    BRANCH: 0.10

accounts:
  savings_probability:
    RETAIL: 0.40
    PREMIUM: 0.80
    SMALL_BUSINESS: 0.30
  status_weights:
    ACTIVE: 0.970
    DORMANT: 0.025
    CLOSED: 0.005
  median_balance:
    RETAIL: 2500
    PREMIUM: 25000
    SMALL_BUSINESS: 15000
  balance_sigma: 1.0
  currency: USD

cards:
  network_weights:
    VISA: 0.60
    MASTERCARD: 0.40
  validity_years: 4

merchants:
  n_merchants: 500
  foreign_online_share: 0.15
  foreign_countries: [GB, CA, DE, NL, SG, HK, CN, AE]
  categories:
    GROCERY:          {mcc: 5411, weight: 0.14, channel: IN_STORE, risk: LOW}
    RESTAURANT:       {mcc: 5812, weight: 0.18, channel: IN_STORE, risk: LOW}
    FUEL:             {mcc: 5541, weight: 0.07, channel: IN_STORE, risk: LOW}
    PHARMACY:         {mcc: 5912, weight: 0.05, channel: IN_STORE, risk: LOW}
    CLOTHING:         {mcc: 5651, weight: 0.09, channel: BOTH,     risk: MEDIUM}
    DEPARTMENT_STORE: {mcc: 5311, weight: 0.05, channel: BOTH,     risk: MEDIUM}
    ELECTRONICS:      {mcc: 5732, weight: 0.07, channel: BOTH,     risk: HIGH}
    TRAVEL:           {mcc: 4722, weight: 0.05, channel: ONLINE,   risk: MEDIUM}
    JEWELLERY:        {mcc: 5944, weight: 0.03, channel: BOTH,     risk: HIGH}
    UTILITIES:        {mcc: 4900, weight: 0.03, channel: ONLINE,   risk: LOW}
    TELECOM:          {mcc: 4814, weight: 0.03, channel: ONLINE,   risk: LOW}
    ENTERTAINMENT:    {mcc: 7832, weight: 0.06, channel: BOTH,     risk: MEDIUM}
    DIGITAL_GOODS:    {mcc: 5818, weight: 0.09, channel: ONLINE,   risk: HIGH}
    GAMING:           {mcc: 5816, weight: 0.06, channel: ONLINE,   risk: HIGH}

devices:
  branch_no_device_probability: 0.50
  extra_device_probability: 0.30
  mobile_os_weights:
    IOS: 0.45
    ANDROID: 0.55
  extra_device_weights:
    IOS: 0.30
    ANDROID: 0.30
    WEB_BROWSER: 0.40

simulation:
  start_date: "2026-06-01"
  n_days: 90
  bank_code: NORTHBRIDGE
  external_banks: [HARBOR_BANK, SUMMIT_CU, PIONEER_BANK, CRESTVIEW_BANK, UNITY_FEDERAL]

transactions:
  daily_rate:                # average transactions per customer per day
    RETAIL: 1.6
    PREMIUM: 1.7
    SMALL_BUSINESS: 2.5
  type_weights:
    CARD_PURCHASE: 0.61
    TRANSFER_OUT: 0.20
    TRANSFER_IN: 0.04
    BILL_PAYMENT: 0.07
    ATM_WITHDRAWAL: 0.08
  amounts:                   # median and spread (sigma) of a log-normal distribution
    CARD_PURCHASE:   {median: 40,  sigma: 0.9}
    TRANSFER_OUT:    {median: 120, sigma: 1.0}
    TRANSFER_IN:     {median: 150, sigma: 1.0}
    BILL_PAYMENT:    {median: 90,  sigma: 0.5}
    ATM_WITHDRAWAL:  {median: 100, sigma: 0.6}
    BUSINESS_INCOME: {median: 260, sigma: 0.8}
  income_midpoint:           # yearly income: sizes salaries and scales spending
    "<30k": 24000
    "30k-50k": 40000
    "50k-80k": 65000
    "80k-150k": 115000
    "150k-300k": 225000
    ">300k": 400000
  income_reference: 3000     # monthly income at which amounts equal the medians above
  salary_day: 25
  business_income_rate: 0.5  # SMALL_BUSINESS incoming payments per day
  internal_transfer_share: 0.30   # share of payees who also bank with us
  regular_payees: 4                # people each customer pays regularly
  regular_payee_share: 0.85        # transfers that go to a regular payee
  attempt_when_short: 0.25   # share of customers who still try to pay when funds are short
  favourite_merchants: 8
  favourite_merchant_share: 0.80
  hour_weights: [1, 1, 1, 1, 1, 2, 4, 6, 8, 8, 9, 10, 12, 11, 9, 8, 8, 9, 10, 10, 9, 7, 4, 2]

fraud:
  mule_share: 0.015              # share of customers recruited as money mules
  mule_max_age: 35
  mule_max_tenure_days: 365      # mules are usually recently opened accounts
  mule_segment: RETAIL           # mules typically have small balances
  cases:                         # number of fraud cases over the whole simulation
    ACCOUNT_TAKEOVER: 60
    SCAM: 40
    CARD_NOT_PRESENT: 80
  account_takeover:
    transfers: [2, 5]
    minutes_between: [2, 15]
    drain_fraction: [0.3, 0.7]   # share of the current balance taken per transfer
    to_mule_share: 0.6
    night_hours: [0, 1, 2, 3, 4, 5]
    night_share: 0.6
  scam:
    older_victim_age: 60
    older_victim_weight: 3       # older customers are targeted more often
    payments: [1, 4]
    days_span: [1, 7]
    balance_fraction: [0.2, 0.5]
    max_payment: [1000, 15000]
    to_mule_share: 0.5
    hours: [9, 20]
  card_not_present:
    purchases: [3, 8]
    hours_span: [1, 6]
    amount: [100, 1500]
    test_amount: [1, 5]
    foreign_share: 0.6
  mule_cashout:
    delay_minutes: [30, 720]
    received_fraction: [0.9, 1.0]   # mules keep a small cut
    atm_max_withdrawal: 1000
    onward_transfer_share: 0.4
